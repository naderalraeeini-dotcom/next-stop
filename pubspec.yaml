name: next_stop
description: Next Stop route and delivery stop organizer
publish_to: "none"
version: 1.0.4+5
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  file_picker: ^8.1.4
  path_provider: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon/next_stop.png
  adaptive_icon_background: '#071A42'
  adaptive_icon_foreground: assets/icon/next_stop_foreground.png
