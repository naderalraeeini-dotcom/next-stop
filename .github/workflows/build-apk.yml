name: Build Next Stop APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name next_stop
      - name: Install icon generation dependency
        run: python3 -m pip install --user pillow
      - name: Create Next Stop launcher icon assets
        run: |
          mkdir -p assets/icon
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import math
          size=1024
          navy=(7,26,66,255)
          orange=(255,151,0,255)
          white=(255,255,255,255)
          def bezier(p0,p1,p2,p3,n=100):
              out=[]
              for i in range(n+1):
                  t=i/n; u=1-t
                  x=u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0]
                  y=u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
                  out.append((int(x),int(y)))
              return out
          route=[]
          route += bezier((310,820),(480,790),(800,790),(760,650),60)
          route += bezier((760,650),(730,550),(430,620),(450,490),60)[1:]
          route += bezier((450,490),(470,390),(750,480),(730,370),60)[1:]
          def draw_icon(path, transparent=False):
              im=Image.new('RGBA',(size,size),(0,0,0,0) if transparent else navy)
              d=ImageDraw.Draw(im)
              d.line(route,fill=orange,width=62,joint='curve')
              for x,y in [(310,820),(450,490),(730,370)]:
                  d.ellipse((x-54,y-54,x+54,y+54),fill=orange)
                  d.ellipse((x-29,y-29,x+29,y+29),fill=white)
              # Destination pin with dark center.
              cx,cy=735,235
              d.ellipse((cx-105,cy-105,cx+105,cy+105),fill=orange)
              d.polygon([(cx-83,cy+42),(cx+83,cy+42),(cx,cy+174)],fill=orange)
              d.ellipse((cx-43,cy-43,cx+43,cy+43),fill=navy if not transparent else (7,26,66,255))
              im.save(path)
          draw_icon('assets/icon/next_stop.png',False)
          draw_icon('assets/icon/next_stop_foreground.png',True)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Configure persistent release signing when secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Persistent signing secrets are not configured; this APK will use the CI default signing key and may not update an existing installation."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/next-stop-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=next-stop-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          marker='android {'
          if marker not in s:
              raise SystemExit('Could not locate android block in generated Gradle file')
          signing='''android {
              signingConfigs {
                  create("release") {
                      keyAlias = providers.gradleProperty("unused").orNull ?: System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("next-stop-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
          s=s.replace(marker, signing, 1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: next-stop-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
