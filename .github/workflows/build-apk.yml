name: Build Next Stop APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name next_stop
      - name: Create Next Stop launcher icon assets
        run: |
          mkdir -p assets/icon
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import math
          size=1024
          navy=(7,26,66,255)
          orange=(255,151,0,255)
          white=(255,255,255,255)
          def bezier(p0,p1,p2,p3,n=100):
              out=[]
              for i in range(n+1):
                  t=i/n; u=1-t
                  x=u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0]
                  y=u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
                  out.append((int(x),int(y)))
              return out
          route=[]
          route += bezier((310,820),(480,790),(800,790),(760,650),60)
          route += bezier((760,650),(730,550),(430,620),(450,490),60)[1:]
          route += bezier((450,490),(470,390),(750,480),(730,370),60)[1:]
          def draw_icon(path, transparent=False):
              im=Image.new('RGBA',(size,size),(0,0,0,0) if transparent else navy)
              d=ImageDraw.Draw(im)
              d.line(route,fill=orange,width=62,joint='curve')
              for x,y in [(310,820),(450,490),(730,370)]:
                  d.ellipse((x-54,y-54,x+54,y+54),fill=orange)
                  d.ellipse((x-29,y-29,x+29,y+29),fill=white)
              # Destination pin with dark center.
              cx,cy=735,235
              d.ellipse((cx-105,cy-105,cx+105,cy+105),fill=orange)
              d.polygon([(cx-83,cy+42),(cx+83,cy+42),(cx,cy+174)],fill=orange)
              d.ellipse((cx-43,cy-43,cx+43,cy+43),fill=navy if not transparent else (7,26,66,255))
              im.save(path)
          draw_icon('assets/icon/next_stop.png',False)
          draw_icon('assets/icon/next_stop_foreground.png',True)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: next-stop-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
